# Versions of the Android verification build (ADR-0012, ADR-0044). Every entry has its row in
# docs/dependencies.md; a bump is an ordinary dependency change recorded there and in docs/android-compatibility.md.
[versions]
android-gradle-plugin = "9.2.1"
desugar-jdk-libs = "2.1.5"
androidx-test-runner = "1.7.0"
androidx-test-ext-junit = "1.3.0"
junit4 = "4.13.2"

[libraries]
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar-jdk-libs" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
junit4 = { module = "junit:junit", version.ref = "junit4" }

[plugins]
android-application = { id = "com.android.application", version.ref = "android-gradle-plugin" }
android-library = { id = "com.android.library", version.ref = "android-gradle-plugin" }
