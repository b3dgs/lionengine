# Tuning phase only: pull requests opened by the agents are squash-merged automatically once
# docs-check passes on the merge result, so that the owner is never a bottleneck.
# To stop: delete this file (or restrict the allow-lists below). See docs/change-process.md.
#
# Notes:
# - The branch ruleset requires signed commits and has no required status check, so this workflow
#   runs the check itself and only squash-merges (GitHub signs the resulting commit).
# - Pull requests that accept an ADR or validate a requirement are merged too (owner decision of
#   2026-11-22): an agent opens such a pull request only on the owner's explicit request. They are
#   flagged with a notice in the run log, so they stay easy to find and revert.
name: auto-merge-agent-prs

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    branches: [rewrite/v11]

# One merge at a time, so that each check runs on the result of the previous merge.
concurrency:
  group: auto-merge-agent-prs
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 'packet/') || startsWith(github.head_ref, 'claude/')) &&
      contains(fromJSON('["claude[bot]", "DjThunder", "b3dgs"]'), github.event.pull_request.user.login)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      URL: ${{ github.event.pull_request.html_url }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Check documentation on the merge result
        run: python3 -I scripts/check-docs.py
      - name: Flag pull requests that validate a decision
        run: |
          if gh pr diff "$URL" | grep -qE '^\+(- Status: ACCEPTED|\*\*Status: VALIDATED|\|.*\| VALIDATED)'; then
            echo "::notice::This pull request accepts an ADR or validates a requirement (owner request); merging it."
          fi
      - name: Squash-merge
        run: gh pr merge "$URL" --squash --match-head-commit "$SHA"
