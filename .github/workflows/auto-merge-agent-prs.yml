# Tuning phase only: pull requests opened by the agents are squash-merged automatically once the
# checks pass on the merge result, so that the owner is never a bottleneck.
# To stop: delete this file (or restrict the allow-lists below). See docs/change-process.md.
#
# Notes:
# - The branch ruleset requires signed commits and has no required status check, so this workflow
#   runs the checks itself and only squash-merges (GitHub signs the resulting commit).
# - A merge made with the workflow token starts no workflow on the target branch (GitHub rule), so the
#   build of the merge result runs here, before merging, whenever the pull request changes more than
#   documentation: Maven build and tests, then the module, API index and provenance checks. After the
#   merge of such a pull request, the "merge" job starts build.yml on the target branch by workflow_dispatch, the
#   one event the workflow token may trigger, with after_merge true: rewrite/v11 is then built and analyzed by Sonar
#   (linux job) and benchmarked; desktop and android, which ran on the merge result of the pull request, are skipped.
#   A pull request that changes documentation only (docs/ and root Markdown files) starts no build.yml run (its
#   paths-ignore): the merge job neither waits for its checks nor dispatches a build after it.
# - After the merge, the "merge" job deletes the head branch through the API: the repository setting
#   "Automatically delete head branches" does not apply to a merge made with the workflow token, and
#   "gh pr merge --delete-branch" relies on that setting when it is on, so it deletes nothing. A failed deletion
#   (a ruleset protecting the branch) is a warning in the run log, never a failed merge.
# - A pull request merged by hand (by an agent or the owner) while this workflow waits for its checks is no
#   longer open when the "merge" job reads its state: the job then skips the merge and the dispatch of build.yml,
#   the push of that merge having already started the build of rewrite/v11 (a second build would cancel it).
# - Before merging, the "merge" job waits for the "linux" and "android" checks of build.yml on the head commit
#   of the pull request and merges only when both succeed: "linux" fails with the build, the tests or the Sonar
#   quality gate (its build runs the analysis), "android" when the shared modules fail lint NewApi, D8, R8 or the API 21 emulator tests (ADR-0044). A
#   failed, skipped or late check leaves the pull request open; a new push, or a re-run of this workflow after
#   the checks succeed, merges it.
# - The pull request's code runs in the "verify" job, which has read-only permissions and no stored
#   credentials; only the "merge" job holds the write token, and it runs no code of the pull request.
# - Pull requests that accept an ADR or validate a requirement are merged too (owner decision of
#   2026-11-22): an agent opens such a pull request only on the owner's explicit request. They are
#   flagged with a notice in the run log, so they stay easy to find and revert.
# - Local-agent pull requests (branches local/*, ADR-0053) are merged only after a cloud review: the
#   reviewer adds the label "cloud-reviewed" from an allow-listed account, which starts this workflow on the
#   "labeled" event; the checks are the same. Any push to a local/* pull request removes the label
#   ("reset-review" job), so the approval always covers the head commit.
# - Actions are pinned to the commits used by the master workflow ci-cd.yml.
name: auto-merge-agent-prs

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, labeled]
    branches: [rewrite/v11]

# One merge at a time, so that each check runs on the result of the previous merge.
concurrency:
  group: auto-merge-agent-prs
  cancel-in-progress: false

permissions: {}

jobs:
  # A new push to a local-agent pull request invalidates its cloud review (ADR-0053). Runs no code of the pull request.
  reset-review:
    if: >
      github.event.action == 'synchronize' &&
      startsWith(github.head_ref, 'local/') &&
      contains(github.event.pull_request.labels.*.name, 'cloud-reviewed')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      URL: ${{ github.event.pull_request.html_url }}
    steps:
      - name: Remove the label cloud-reviewed
        run: gh pr edit "$URL" --remove-label cloud-reviewed

  # Agent branches packet/* and claude/* on every event but "labeled"; local-agent branches local/* only on
  # the label "cloud-reviewed" added by an allow-listed account (ADR-0053).
  verify:
    if: >
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["claude[bot]", "DjThunder", "b3dgs"]'), github.event.pull_request.user.login) &&
      (((startsWith(github.head_ref, 'packet/') || startsWith(github.head_ref, 'claude/')) &&
        github.event.action != 'labeled') ||
       (startsWith(github.head_ref, 'local/') &&
        github.event.action == 'labeled' &&
        github.event.label.name == 'cloud-reviewed' &&
        contains(fromJSON('["claude[bot]", "DjThunder", "b3dgs"]'), github.event.sender.login)))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.changes.outputs.build }}
    steps:
      - name: Checkout the merge result
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Check documentation on the merge result
        run: python3 -I scripts/check-docs.py

      - name: Detect changes outside the documentation
        id: changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: ${{ github.event.pull_request.html_url }}
        run: |
          if gh pr diff "$URL" --name-only | grep -qvE '^(docs/|[^/]+\.md$)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache
        if: steps.changes.outputs.build == 'true'
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: ~/.m2/repository
          key: maven-${{ github.job }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ github.job }}-
            maven-

      - name: Java
        if: steps.changes.outputs.build == 'true'
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: 25

      - name: Maven distribution cache (no download from Maven Central on a hit)
        if: steps.changes.outputs.build == 'true'
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: ${{ runner.tool_cache }}/maven/3.9.14
          key: maven-dist-3.9.14-${{ runner.os }}-${{ runner.arch }}

      - name: Maven
        id: maven
        if: steps.changes.outputs.build == 'true'
        continue-on-error: true
        uses: stCarolas/setup-maven@12eb41b233df95d49b0c11fc1b5bc8312e5d4ce0
        with:
          maven-version: 3.9.14

      - name: Wait before retrying the Maven download (rate limit of Maven Central)
        if: steps.changes.outputs.build == 'true' && steps.maven.outcome == 'failure'
        run: sleep 60

      - name: Maven (retry)
        id: maven-retry
        if: steps.changes.outputs.build == 'true' && steps.maven.outcome == 'failure'
        continue-on-error: true
        uses: stCarolas/setup-maven@12eb41b233df95d49b0c11fc1b5bc8312e5d4ce0
        with:
          maven-version: 3.9.14

      - name: Wait longer before the last Maven download attempt
        if: steps.changes.outputs.build == 'true' && steps.maven-retry.outcome == 'failure'
        run: sleep 180

      - name: Maven (last retry)
        if: steps.changes.outputs.build == 'true' && steps.maven-retry.outcome == 'failure'
        uses: stCarolas/setup-maven@12eb41b233df95d49b0c11fc1b5bc8312e5d4ce0
        with:
          maven-version: 3.9.14

      - name: Build, checkstyle, package rule, tests, Javadoc
        if: steps.changes.outputs.build == 'true'
        run: mvn -B -ntp verify

      - name: Module dependencies, API index, asset provenance
        if: steps.changes.outputs.build == 'true'
        run: |
          python3 -I scripts/check-modules.py
          python3 -I scripts/check-api-index.py
          python3 -I scripts/check-provenance.py

  merge:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      actions: write
      checks: read
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      URL: ${{ github.event.pull_request.html_url }}
      SHA: ${{ github.event.pull_request.head.sha }}
      BASE: ${{ github.event.pull_request.base.ref }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Flag pull requests that validate a decision
        run: |
          if gh pr diff "$URL" | grep -qE '^\+(- Status: ACCEPTED|\*\*Status: VALIDATED|\|.*\| VALIDATED)'; then
            echo "::notice::This pull request accepts an ADR or validates a requirement (owner request); merging it."
          fi

      # The last run of each check on the head commit, polled every 30 s for at most 40 minutes in all. A pull request
      # of documentation only starts no build.yml run (paths-ignore), so there is nothing to wait for.
      - name: Wait for the build with the Sonar quality gate and the Android/DEX job of the pull request
        if: needs.verify.outputs.build == 'true'
        run: |
          for check in linux android; do
            while true; do
              if [ "$SECONDS" -ge 2400 ]; then
                echo "::error::The $check check did not complete in time. The pull request is not merged."
                exit 1
              fi
              result=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?check_name=$check" \
                --jq '.check_runs | sort_by(.started_at) | last | "\(.status) \(.conclusion)"')
              case "$result" in
                "completed success")
                  echo "The $check check passed."
                  break
                  ;;
                completed*)
                  echo "::error::The $check check ended with: $result. The pull request is not merged."
                  exit 1
                  ;;
                *)
                  echo "The $check check is not completed yet: $result"
                  ;;
              esac
              sleep 30
            done
          done

      # A pull request merged by hand meanwhile: its push already started the build of the branch.
      - name: Read the state of the pull request
        id: state
        run: |
          state=$(gh pr view "$URL" --json state -q .state)
          if [ "$state" = "OPEN" ]; then
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The pull request is $state, merged or closed by hand: no merge and no build dispatch."
          fi

      - name: Squash-merge
        if: steps.state.outputs.open == 'true'
        run: gh pr merge "$URL" --squash --match-head-commit "$SHA"

      # "Automatically delete head branches" ignores merges of the workflow token, and gh pr merge --delete-branch
      # leaves the deletion to that setting when it is on: the branch is deleted here, through the API.
      - name: Delete the head branch
        if: steps.state.outputs.open == 'true'
        run: |
          if gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$HEAD_REF"; then
            echo "Head branch $HEAD_REF deleted."
          else
            echo "::warning::The head branch $HEAD_REF was not deleted; delete it by hand."
          fi

      # Build, Sonar analysis and benchmark of the merged branch, after a pull request that changes more than
      # documentation; every such commit of rewrite/v11 gets one complete build of these jobs (the
      # concurrency of build.yml cancels in-progress runs of pull requests only).
      - name: Start the build of the merged branch
        if: steps.state.outputs.open == 'true' && needs.verify.outputs.build == 'true'
        run: >
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/dispatches"
          -f ref="$BASE" -f "inputs[after_merge]=true"
