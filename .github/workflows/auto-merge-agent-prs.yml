# Tuning phase only: pull requests opened by the agents are squash-merged automatically once the
# checks pass on the merge result, so that the owner is never a bottleneck.
# To stop: delete this file (or restrict the allow-lists below). See docs/change-process.md.
#
# Notes:
# - The branch ruleset requires signed commits and has no required status check, so this workflow
#   runs the checks itself and only squash-merges (GitHub signs the resulting commit).
# - A merge made with the workflow token starts no workflow on the target branch (GitHub rule), so the
#   build of the merge result runs here, before merging, whenever the pull request changes more than
#   documentation: Maven build and tests, then the module, API index and provenance checks. After the
#   merge, the "merge" job starts build.yml on the target branch by workflow_dispatch, the one event the
#   workflow token may trigger: rewrite/v11 is then built and analyzed by Sonar after every merge.
# - Before merging, the "merge" job waits for the "sonar" and "android" checks of build.yml on the head commit
#   of the pull request and merges only when both succeed: "sonar" fails when the Sonar quality gate fails,
#   "android" when the shared modules fail lint NewApi, D8, R8 or the API 21 emulator tests (ADR-0044). A
#   failed, skipped or late check leaves the pull request open; a new push, or a re-run of this workflow after
#   the checks succeed, merges it.
# - The pull request's code runs in the "verify" job, which has read-only permissions and no stored
#   credentials; only the "merge" job holds the write token, and it runs no code of the pull request.
# - Pull requests that accept an ADR or validate a requirement are merged too (owner decision of
#   2026-11-22): an agent opens such a pull request only on the owner's explicit request. They are
#   flagged with a notice in the run log, so they stay easy to find and revert.
# - Local-agent pull requests (branches local/*, ADR-0053) are merged only after a cloud review: the
#   reviewer adds the label "cloud-reviewed" from an allow-listed account, which starts this workflow on the
#   "labeled" event; the checks are the same. Any push to a local/* pull request removes the label
#   ("reset-review" job), so the approval always covers the head commit.
# - Actions are pinned to the commits used by the master workflow ci-cd.yml.
name: auto-merge-agent-prs

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, labeled]
    branches: [rewrite/v11]

# One merge at a time, so that each check runs on the result of the previous merge.
concurrency:
  group: auto-merge-agent-prs
  cancel-in-progress: false

permissions: {}

jobs:
  # A new push to a local-agent pull request invalidates its cloud review (ADR-0053). Runs no code of the pull request.
  reset-review:
    if: >
      github.event.action == 'synchronize' &&
      startsWith(github.head_ref, 'local/') &&
      contains(github.event.pull_request.labels.*.name, 'cloud-reviewed')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      URL: ${{ github.event.pull_request.html_url }}
    steps:
      - name: Remove the label cloud-reviewed
        run: gh pr edit "$URL" --remove-label cloud-reviewed

  # Agent branches packet/* and claude/* on every event but "labeled"; local-agent branches local/* only on
  # the label "cloud-reviewed" added by an allow-listed account (ADR-0053).
  verify:
    if: >
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["claude[bot]", "DjThunder", "b3dgs"]'), github.event.pull_request.user.login) &&
      (((startsWith(github.head_ref, 'packet/') || startsWith(github.head_ref, 'claude/')) &&
        github.event.action != 'labeled') ||
       (startsWith(github.head_ref, 'local/') &&
        github.event.action == 'labeled' &&
        github.event.label.name == 'cloud-reviewed' &&
        contains(fromJSON('["claude[bot]", "DjThunder", "b3dgs"]'), github.event.sender.login)))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout the merge result
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Check documentation on the merge result
        run: python3 -I scripts/check-docs.py

      - name: Detect changes outside the documentation
        id: changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: ${{ github.event.pull_request.html_url }}
        run: |
          if gh pr diff "$URL" --name-only | grep -qvE '^(docs/|[^/]+\.md$)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache
        if: steps.changes.outputs.build == 'true'
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      - name: Java
        if: steps.changes.outputs.build == 'true'
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: 25

      - name: Maven
        id: maven
        if: steps.changes.outputs.build == 'true'
        continue-on-error: true
        uses: stCarolas/setup-maven@12eb41b233df95d49b0c11fc1b5bc8312e5d4ce0
        with:
          maven-version: 3.9.14

      - name: Wait before retrying the Maven download (rate limit of Maven Central)
        if: steps.changes.outputs.build == 'true' && steps.maven.outcome == 'failure'
        run: sleep 60

      - name: Maven (retry)
        if: steps.changes.outputs.build == 'true' && steps.maven.outcome == 'failure'
        uses: stCarolas/setup-maven@12eb41b233df95d49b0c11fc1b5bc8312e5d4ce0
        with:
          maven-version: 3.9.14

      - name: Build, checkstyle, package rule, tests, Javadoc
        if: steps.changes.outputs.build == 'true'
        run: mvn -B -ntp verify

      - name: Module dependencies, API index, asset provenance
        if: steps.changes.outputs.build == 'true'
        run: |
          python3 -I scripts/check-modules.py
          python3 -I scripts/check-api-index.py
          python3 -I scripts/check-provenance.py

  merge:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      actions: write
      checks: read
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      URL: ${{ github.event.pull_request.html_url }}
      SHA: ${{ github.event.pull_request.head.sha }}
      BASE: ${{ github.event.pull_request.base.ref }}
    steps:
      - name: Flag pull requests that validate a decision
        run: |
          if gh pr diff "$URL" | grep -qE '^\+(- Status: ACCEPTED|\*\*Status: VALIDATED|\|.*\| VALIDATED)'; then
            echo "::notice::This pull request accepts an ADR or validates a requirement (owner request); merging it."
          fi

      # The last run of each check on the head commit, polled every 30 s for at most 40 minutes in all.
      - name: Wait for the Sonar quality gate and the Android/DEX job of the pull request
        run: |
          for check in sonar android; do
            while true; do
              if [ "$SECONDS" -ge 2400 ]; then
                echo "::error::The $check check did not complete in time. The pull request is not merged."
                exit 1
              fi
              result=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?check_name=$check" \
                --jq '.check_runs | sort_by(.started_at) | last | "\(.status) \(.conclusion)"')
              case "$result" in
                "completed success")
                  echo "The $check check passed."
                  break
                  ;;
                completed*)
                  echo "::error::The $check check ended with: $result. The pull request is not merged."
                  exit 1
                  ;;
                *)
                  echo "The $check check is not completed yet: $result"
                  ;;
              esac
              sleep 30
            done
          done

      - name: Squash-merge
        run: gh pr merge "$URL" --squash --match-head-commit "$SHA"

      # Build and Sonar analysis of the merged branch; a later merge cancels a build still running
      # (concurrency of build.yml), so the branch head is always the one analyzed.
      - name: Start the build of the merged branch
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/dispatches" -f ref="$BASE"
