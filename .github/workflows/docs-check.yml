# Documentation consistency check (links, identifiers, traceability).
# The code build and its structural checks are in build.yml (ADR-0012, ADR-0042).
name: docs-check

on:
  push:
  pull_request:

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check documentation consistency
        run: python3 -I scripts/check-docs.py
