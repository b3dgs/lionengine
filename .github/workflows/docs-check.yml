# Documentation consistency check (links, identifiers, traceability).
# Documentation only: the build/CI platform for the code itself is still open (OQ-008).
name: docs-check

on:
  push:
  pull_request:

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check documentation consistency
        run: python3 -I scripts/check-docs.py
