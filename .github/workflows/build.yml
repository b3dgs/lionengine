# Build and structural checks of the engine (features/build-skeleton.md, ADR-0012, ADR-0042, ADR-0044, ADR-0045).
# The Linux jobs also run the platform tests (tag "platform", profile platform-tests, docs/testing.md) on the virtual
# display of xvfb-run; the desktop jobs run the default build without them.
# The documentation check runs in docs-check.yml. The android job runs the Android/DEX verification of the
# android/ Gradle build (ADR-0012, ADR-0044, docs/android-compatibility.md).
# Actions are pinned to the commits used by the master workflow ci-cd.yml.
name: build

on:
  push:
    branches:
      - rewrite/v11
  pull_request:
    branches:
      - rewrite/v11
  # Started by auto-merge-agent-prs.yml after each merge (a merge made with the workflow token starts no
  # push build), and by hand on any branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    # Blocking reference job (REQ-SUPPORT-001).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1

      - name: Cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      - name: Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: 25

      - name: Maven
        id: maven
        continue-on-error: true
        uses: stCarolas/setup-maven@12eb41b233df95d49b0c11fc1b5bc8312e5d4ce0
        with:
          maven-version: 3.9.14

      - name: Wait before retrying the Maven download (rate limit of Maven Central)
        if: steps.maven.outcome == 'failure'
        run: sleep 60

      - name: Maven (retry)
        if: steps.maven.outcome == 'failure'
        uses: stCarolas/setup-maven@12eb41b233df95d49b0c11fc1b5bc8312e5d4ce0
        with:
          maven-version: 3.9.14

      - name: Build, checkstyle, package rule, tests including the platform tests (Xvfb display), Javadoc
        run: xvfb-run -a mvn -B -ntp verify -Pplatform-tests

      - name: Module dependencies (REQ-CORE-005, ADR-0045)
        run: python3 -I scripts/check-modules.py

      - name: API index (REQ-DOC-005)
        run: python3 -I scripts/check-api-index.py

      - name: Asset provenance (REQ-DOC-006)
        run: python3 -I scripts/check-provenance.py

  desktop:
    # Non-blocking until green, then claimed supported (REQ-SUPPORT-001, ADR-0031).
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1

      - name: Cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: ~/.m2/repository
          key: maven-${{ matrix.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ matrix.os }}-

      - name: Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: 25

      - name: Maven
        id: maven
        continue-on-error: true
        uses: stCarolas/setup-maven@12eb41b233df95d49b0c11fc1b5bc8312e5d4ce0
        with:
          maven-version: 3.9.14

      - name: Wait before retrying the Maven download (rate limit of Maven Central)
        if: steps.maven.outcome == 'failure'
        run: sleep 60

      - name: Maven (retry)
        if: steps.maven.outcome == 'failure'
        uses: stCarolas/setup-maven@12eb41b233df95d49b0c11fc1b5bc8312e5d4ce0
        with:
          maven-version: 3.9.14

      - name: Build and tests
        run: mvn -B -ntp verify

  android:
    # Android/DEX verification (ADR-0012, ADR-0044, REQ-TECH-006, REQ-TECH-007), blocking: the modules installed by
    # Maven are checked by lint NewApi from their sources, dexed by D8 (debug) and R8 (release), and run on an API 21
    # emulator by the instrumentation tests of android/verification. Commands: docs/android-compatibility.md.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1

      - name: Cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            ~/.m2/repository
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-${{ hashFiles('**/pom.xml', 'android/**/*.kts', 'android/gradle/**') }}
          restore-keys: android-

      - name: Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: 25

      - name: Maven
        id: maven
        continue-on-error: true
        uses: stCarolas/setup-maven@12eb41b233df95d49b0c11fc1b5bc8312e5d4ce0
        with:
          maven-version: 3.9.14

      - name: Wait before retrying the Maven download (rate limit of Maven Central)
        if: steps.maven.outcome == 'failure'
        run: sleep 60

      - name: Maven (retry)
        if: steps.maven.outcome == 'failure'
        uses: stCarolas/setup-maven@12eb41b233df95d49b0c11fc1b5bc8312e5d4ce0
        with:
          maven-version: 3.9.14

      - name: Install the engine modules in the local Maven repository
        run: mvn -B -ntp install

      - name: Lint NewApi on the shared sources, D8 and R8 builds, DEX content, test APK
        working-directory: android
        run: >
          ./gradlew --no-daemon
          :api-lint:lintDebug
          :verification:verifyDebugDex
          :verification:verifyReleaseDex
          :verification:assembleDebugAndroidTest

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumentation tests on an API 21 emulator
        # reactivecircus/android-emulator-runner v2.38.0
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 21
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android
          script: ./gradlew --no-daemon :verification:connectedDebugAndroidTest

      - name: Upload the lint, DEX and test reports
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: android-reports
          path: |
            android/api-lint/build/reports/
            android/verification/build/reports/
            android/verification/build/outputs/androidTest-results/
          if-no-files-found: ignore

  sonar:
    # SonarCloud analysis with the master project settings; skipped when the token is not available
    # (pull requests from forks, repositories without the secret). Fails when the quality gate fails.
    needs: linux
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        if: env.SONAR_TOKEN != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Cache
        if: env.SONAR_TOKEN != ''
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      - name: Java
        if: env.SONAR_TOKEN != ''
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: 25

      - name: Maven
        id: maven
        if: env.SONAR_TOKEN != ''
        continue-on-error: true
        uses: stCarolas/setup-maven@12eb41b233df95d49b0c11fc1b5bc8312e5d4ce0
        with:
          maven-version: 3.9.14

      - name: Wait before retrying the Maven download (rate limit of Maven Central)
        if: env.SONAR_TOKEN != '' && steps.maven.outcome == 'failure'
        run: sleep 60

      - name: Maven (retry)
        if: env.SONAR_TOKEN != '' && steps.maven.outcome == 'failure'
        uses: stCarolas/setup-maven@12eb41b233df95d49b0c11fc1b5bc8312e5d4ce0
        with:
          maven-version: 3.9.14

      - name: Sonar
        if: env.SONAR_TOKEN != ''
        run: >
          xvfb-run -a mvn -B -ntp verify -Psonar,platform-tests
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=b3dgs
          -Dsonar.projectKey=b3dgs_lionengine
          -Dsonar.qualitygate.wait=true
          -Dsonar.token=${{ env.SONAR_TOKEN }}
